title: Dave Parr
description: Geographer, Spatial Data Scientist
author: Dave Parr
logo: /assets/img/brand/logo.png
lang: en-US
timezone: America/New_York

# The Pages workflow overrides these for wherever the site is served.
url: "https://daveparr.com"
baseurl: ""

# Jekyll's standard post URLs, e.g. /2026/07/28/post-title.html
permalink: date

# Every post uses the post layout (and its stylesheet) unless it says otherwise
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Added to every page by _plugins/google_tag_manager.rb.
# GA4 is loaded directly here, so don't also add a Google tag with this
# measurement ID inside the GTM container, or page views count twice.
google_tag_manager: GTM-522PXQTD
google_analytics: G-BNNGB3KD36

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Header navigation, in order
navigation:
  - title: About
    url: /about/
  - title: Research
    url: /research/
  - title: Courses
    url: /courses/
    dropdown: courses   # submenu items come from _data/courses.yml
  - title: GIS@UNC Newsletters
    url: /newsletters/

# Jekyll skips files that start with _ unless listed here. _redirects is
# Cloudflare's redirect list (old /geog215/ links -> /intro-spatial-data-science/).
include:
  - _redirects

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - vendor/
  - wrangler.jsonc
  # The GEOG 370 PDF textbook is over Cloudflare's 25 MiB per-file limit, so
  # it is hosted as a GitHub release asset instead (see _redirects).
  - geographic-information-science/Geographic-Information-Science.pdf
