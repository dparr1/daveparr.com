title: Dave Parr
description: Geographer, Spatial Data Scientist
author: Dave Parr
lang: en-US
timezone: America/New_York

# The Pages workflow overrides these for wherever the site is served.
url: "https://daveparr.com"
baseurl: ""

# Same URL scheme as the old WordPress site, so old links keep working
permalink: /:year/:month/:day/:title/

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Header navigation, in order
navigation:
  - title: About
    url: /about/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - vendor/
  - wrangler.jsonc
