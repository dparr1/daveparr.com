{%- comment -%}
  Click-to-play YouTube embed. Shows a local thumbnail linking to YouTube;
  with JS, clicking swaps in a privacy-enhanced (youtube-nocookie) player.
  Usage: {% include youtube.html id="VIDEO_ID" thumb="/assets/img/..." title="Video title" %}
{%- endcomment -%}
<div class="video-embed youtube-embed" data-youtube-id="{{ include.id }}" data-title="{{ include.title | escape }}">
  <a class="youtube-link" href="https://www.youtube.com/watch?v={{ include.id }}" target="_blank" rel="noopener" aria-label="Play video: {{ include.title | escape }} (opens YouTube)">
    <img src="{{ include.thumb | relative_url }}" alt="Video thumbnail: {{ include.title | escape }}" loading="lazy">
    <span class="youtube-play" aria-hidden="true"></span>
  </a>
</div>
<script>
(function () {
  var box = document.currentScript.previousElementSibling;
  var link = box.querySelector('.youtube-link');
  link.addEventListener('click', function (e) {
    e.preventDefault();
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(box.dataset.youtubeId) + '?autoplay=1';
    f.title = box.dataset.title;
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    box.replaceChild(f, link);
    f.focus();
  });
})();
</script>
