<header class="site-header">
  <div class="wrap header-inner">
    <div class="branding">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/img/brand/logo.png' | relative_url }}" alt="David Parr" width="720" height="277">
      </a>
    </div>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
