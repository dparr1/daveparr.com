<br>
<hr>
<span class="entry-tags">{% for tag in page.tags %}<a href="{{ "/tags/" | relative_url }}#{{ tag }}" title="Pages tagged {{ tag }}" class="tag"><span class="term">{{ tag }}</span></a>{% unless forloop.last %}{% endunless %}{% endfor %}</span>
<span class="social-share">
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" title="Share on Facebook" class="tag">
        <span class="term"><i class="fa fa-facebook-square"></i> Share</span>
    </a>
    <a href="https://twitter.com/intent/tweet?text={{ page.url | absolute_url | url_encode }}" title="Share on Twitter" class="tag">
        <span class="term"><i class="fa fa-twitter-square"></i> Tweet</span>
    </a>
</span>
<div style="clear:both"></div>
