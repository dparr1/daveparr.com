<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dave Parr</title>
  <meta name="description" content="Dave Parr's personal website.">
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161614; --fg: #ecece6; --muted: #9a9a93; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 36rem; padding: 2rem 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 2.25rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Dave Parr</h1>
    <p>New site coming soon.</p>
  </main>
</body>
</html>
