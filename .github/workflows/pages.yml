# Builds the Jekyll site and publishes it to GitHub Pages.
# GitHub's built-in Pages builder only supports Jekyll 3, so this builds with
# the versions in Gemfile.lock instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v6
      # Match url/baseurl to wherever Pages serves the site: github.io/daveparr.com
      # until a custom domain is set, then the domain itself. Only the absolute
      # links (canonical, social previews, feed) use url; page links are relative.
      - run: |
          printf 'url: "%s"\n' "${{ steps.pages.outputs.origin }}" > _pages.yml
          bundle exec jekyll build --config _config.yml,_pages.yml --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
