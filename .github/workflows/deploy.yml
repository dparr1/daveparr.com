name: Build and Deploy mixed Jekyll + Quarto site

on:
  push:
    branches:
      - main # Change to master if your default branch is master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # 1. Checkout main Jekyll repo and include the Quarto submodule
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. Setup Ruby and build Jekyll site
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Adjust to match your preferred Jekyll environment
          bundler-cache: true

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build

      # 3. Setup Quarto and render book inside Jekyll's output folder
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Book into Jekyll subdirectory
        run: |
          cd book
          quarto render --output-dir ../_site/book

      # 4. Publish the unified '_site' folder to Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: YOUR_CLOUDFLARE_PAGES_PROJECT_NAME # Change to your actual project name
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}